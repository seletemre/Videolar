<template>
  <style>

    #s5-underside {
      position: absolute;

    }

      position: absolute;

  </style>
  <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
    <div id="s5-spores" data-layout-ignore></div>
    <div id="s5-underside" data-layout-ignore></div>
    <h2 id="s5-head">Solungacı yok</h2>
    <p id="s5-sub">Sporlarını şapkanın altındaki minik gözeneklerden saçar</p>
    <p id="s5-pre">Akrabası <i>G. applanatum</i> tek sezonda</p>
    <div id="s5-num">~5 trilyon</div>
    <p id="s5-tail">spor saçabilir</p>
  </div>
  <script>
    // voice v5 at 0.2 s: "Dört: Solungacı yoktur, sporlarını minik gözeneklerden saçar; akrabası tek sezonda trilyonlarca spor yayabilir."
    // spores: seeded positions and speeds; each falls as a pure function of scene time
    let seed = 11;
    const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const box = document.getElementById("s5-spores");
    const spores = [];
    for (let i = 0; i < 160; i++) {
      const s = document.createElement("div");
      s.className = "s5-spore";
      s.style.left = (rand() * 1080) + "px";
      s.style.top = "200px";
      box.appendChild(s);
      spores.push({ el: s, delay: rand() * 8, speed: 140 + rand() * 140, sway: 10 + rand() * 20, phase: rand() * 6.28 });
    }
    const tl = gsap.timeline({ paused: true });
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, {
      t: 8.1, duration: 8.1, ease: "none",
      onUpdate: () => {
        for (const p of spores) {
          const life = clock.t - p.delay + 3;
          const y = life > 0 ? life * p.speed : 0;
          const x = Math.sin(p.phase + life * 1.6) * p.sway;
          p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          p.el.style.opacity = life > 0 ? "1" : "0";
        }
      },
    }, 0);
    tl.fromTo("#s5-underside", { y: -120 }, { y: 0, duration: 0.7, ease: "expo.out" }, 0);
    tl.fromTo("#s5-head", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.8);
    tl.fromTo("#s5-sub", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.9);
    tl.fromTo("#s5-pre", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 4.1);
    // "trilyonlarca" at 5.36 s: the number lands (pop)
    tl.fromTo("#s5-num", { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out", transformOrigin: "0% 50%" }, 5.15);
    tl.fromTo("#s5-tail", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 5.9);
    tl.to(["#s5-head", "#s5-sub", "#s5-pre", "#s5-num", "#s5-tail", "#s5-underside"], { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 7.8);
    window.__timelines["s5"] = tl;
  </script>
