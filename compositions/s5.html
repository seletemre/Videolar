<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #efe4cc;
      font-family: "Inter", sans-serif;
      color: #2a0806;
    }
    /* the cap's underside seen from below: a tan surface full of pores */
    #s5-underside {
      position: absolute;
      left: -120px;
      top: -260px;
      width: 2160px;
      height: 470px;
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
      background-color: #c9a877;
      background-image: radial-gradient(circle, #6b4a2a 0 4px, transparent 5px);
      background-size: 22px 22px;
      border-bottom: 14px solid #5e140c;
    }
    #s5-spores {
      position: absolute;
      inset: 0;
    }
    .s5-spore {
      position: absolute;
      width: 9px;
      height: 9px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: #7a4a24;
    }
    #s5-head {
      position: absolute;
      left: 150px;
      top: 330px;
      font-family: "Montserrat", sans-serif;
      font-weight: 800;
      font-size: 104px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    #s5-sub {
      position: absolute;
      left: 160px;
      top: 480px;
      width: 760px;
      font-size: 46px;
      font-weight: 600;
      line-height: 1.22;
    }
    #s5-num {
      position: absolute;
      left: 1090px;
      top: 400px;
      white-space: nowrap;
      font-family: "Montserrat", sans-serif;
      font-weight: 800;
      font-size: 120px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #5e140c;
    }
    #s5-num-label {
      position: absolute;
      left: 1096px;
      top: 560px;
      width: 700px;
      font-size: 42px;
      font-weight: 600;
      line-height: 1.25;
    }
    #s5-num-label i {
      font-style: italic;
    }
  </style>
  <div id="root" data-composition-id="s5" data-width="1920" data-height="1080">
    <div id="s5-spores" data-layout-ignore></div>
    <div id="s5-underside" data-layout-ignore></div>
    <h2 id="s5-head">Solungacı yok</h2>
    <p id="s5-sub">Sporlarını şapkanın altındaki binlerce minik gözenekten saçar</p>
    <div id="s5-num">~5 trilyon</div>
    <p id="s5-num-label">spor: akrabası <i>G. applanatum</i> tek bir sezonda bu kadar saçabilir</p>
  </div>
  <script>
    // spores: seeded positions and speeds; each falls on its own linear path, wrapping by its index
    let seed = 11;
    const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const box = document.getElementById("s5-spores");
    const spores = [];
    for (let i = 0; i < 140; i++) {
      const s = document.createElement("div");
      s.className = "s5-spore";
      s.style.left = (rand() * 1920) + "px";
      s.style.top = "190px";
      box.appendChild(s);
      spores.push({ el: s, delay: rand() * 6, speed: 120 + rand() * 120, sway: 10 + rand() * 20, phase: rand() * 6.28 });
    }
    const tl = gsap.timeline({ paused: true });
    // spore fall is a pure function of scene time t
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, {
      t: 6.5, duration: 6.5, ease: "none",
      onUpdate: () => {
        for (const p of spores) {
          const life = clock.t - p.delay + 2.5; // some spores are already falling at t = 0
          const y = life > 0 ? life * p.speed : 0;
          const x = Math.sin(p.phase + life * 1.6) * p.sway;
          p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
          p.el.style.opacity = life > 0 ? "1" : "0";
        }
      },
    }, 0);
    tl.fromTo("#s5-underside", { y: -120 }, { y: 0, duration: 0.7, ease: "expo.out" }, 0);
    tl.fromTo("#s5-head", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.5);
    tl.fromTo("#s5-sub", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.1);
    // the number lands at 3.4 s (pop)
    tl.fromTo("#s5-num", { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out", transformOrigin: "0% 50%" }, 3.25);
    tl.fromTo("#s5-num-label", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.7);
    // exit: everything blurs out as the ground floods to moss green in s6
    tl.to(["#s5-head", "#s5-sub", "#s5-num", "#s5-num-label", "#s5-underside"], { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 6.2);
    window.__timelines["s5"] = tl;
  </script>
</template>
