<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #2f4a2a;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44.3" data-width="1080" data-height="1920">
      <!-- scenes: one lane, back to back; each is timed to its voice line -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="6.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="6.3" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="11.9" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="18.4" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- voiceover: tr-TR-AhmetNeural (Microsoft Edge TTS), one clip per scene -->
      <audio id="vo1" class="clip" src="assets/voice/v1.mp3" data-duration="5.56" data-start="0.3" data-track-index="4" data-volume="1"></audio>
      <audio id="vo2" class="clip" src="assets/voice/v2.mp3" data-duration="4.86" data-start="6.5" data-track-index="4" data-volume="1"></audio>
      <audio id="vo3" class="clip" src="assets/voice/v3.mp3" data-duration="5.71" data-start="12.1" data-track-index="4" data-volume="1"></audio>

      <audio id="vo7" class="clip" src="assets/voice/v7.mp3" data-duration="4.34" data-start="37.6" data-track-index="4" data-volume="1"></audio>

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });

</html>
